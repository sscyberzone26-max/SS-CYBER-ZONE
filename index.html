<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Token Generator</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#f2f2f2;

display:flex;
justify-content:center;

min-height:100vh;

padding:20px;
}

.container{

max-width:450px;

background:#fff;

padding:25px;

border-radius:15px;

box-shadow:0 0 15px rgba(0,0,0,0.1);

}

h2,h3{
text-align:center;
margin-bottom:15px;
}

input,
select,
button,
textarea{

width:100%;

padding:12px;

margin-top:10px;

border-radius:8px;

font-size:15px;
}

button{

background:#007bff;
color:white;

cursor:pointer;
}

button:hover{
background:#0056b3;
}

.adminBtn{

position:absolute;
top:10px;
right:10px;

width:auto;

padding:8px 12px;

}

.refreshBtn{
background:green;
}

.refreshBtn:hover{
background:darkgreen;
}

.logoutBtn{
background:red;
}

.deleteBtn{
background:red;
}

.statusBox{

background:#f1f1f1;

padding:12px;

border-radius:10px;

text-align:center;

margin-bottom:20px;

font-weight:bold;
}

.noticeBox{

margin-top:15px;

padding:12px;

background:#fff8e1;

border:1px solid #ffd54f;

border-radius:8px;

font-size:13px;

line-height:1.8;
}

#result{

margin-top:20px;

font-size:18px;

color:green;
}

.adminPanel{
display:none;
margin-top:20px;
}

.activityBox{

max-height:200px;

overflow:auto;

background:#f1f1f1;

padding:10px;

border-radius:8px;

font-size:14px;
}

.clock{

text-align:center;

margin-top:15px;

font-weight:bold;
}

/* ===== Go To Main Page Button ===== */
.mainPageBtn{
    display:inline-block;
    width:auto;
    min-width:140px;
    padding:7px 14px;
    margin:8px auto 15px;
    text-align:center;
    text-decoration:none;
    color:#fff;
    background:linear-gradient(135deg,#ff512f,#dd2476);
    border-radius:25px;
    font-size:13px;
    font-weight:600;
    box-shadow:0 0 10px rgba(255,65,108,.7);
    animation:glowMainBtn 1.2s infinite alternate;
    transition:.3s;
}

.mainPageBtn:hover{
    transform:scale(1.05);
    box-shadow:0 0 18px #ff512f,0 0 30px #dd2476;
}

#userSection{
    text-align:center;
}
</style>

</head>

<body>

<div class="container">

<button class="adminBtn"
onclick="toggleLogin()">

Admin

</button>

<div class="statusBox"
id="publicStatus">

Loading...

</div>

<!-- USER SECTION -->

<div id="userSection">

<h2>Token Form</h2>

<a href="https://sscyberzone26-max.github.io/token-generator2/"
   target="_blank"
   class="mainPageBtn">
   🏠 Go To Main Page
</a>

<form id="tokenForm">

<input type="text"
id="name"
placeholder="Name"
required>

<div style="display:flex; gap:5px;">

<input type="text"
value="+91"
readonly
style="
width:80px;
background:#eee;
text-align:center;
font-weight:bold;">

<input type="tel"
id="phone"
placeholder="10 Digit Mobile Number"
maxlength="10"
required>

</div>

<input type="text"
id="address"
placeholder="Address"
required>

<select id="visit" required>

<option value="">
Select Visit Purpose
</option>

<option value="DBT Link">
DBT Link
</option>

<option value="Yubosokti">
Yubosokti
</option>

<option value="Arnopurnavander">
Arnopurnavander
</option>

<option value="CAA">
CAA
</option>

<option value="Others">
Others
</option>

</select>

<textarea
id="otherReason"
placeholder="Write Reason"
style="display:none;">
</textarea>

<input type="text"
id="aadhaar"
maxlength="4"
placeholder="Aadhaar Last 4 Digit"
required>

<button type="submit">

Generate Token

</button>

<button type="button"
class="refreshBtn"
onclick="location.reload()">

Refresh Page

</button>

<div class="noticeBox">

<b>গুরুত্বপূর্ণ নির্দেশিকা :</b>

<ul style="
padding-left:18px;
margin-top:8px;">

<li>
এক মোবাইল নম্বর দ্বিতীয় বার ব্যবহার করা যাবে না।
</li>

<li>
এক ফোন নম্বরে একাধিক ফর্ম হলে কথা বলে টোকেন নিতে হবে।
</li>

<li>
আধার কার্ডের শেষ ৪ ডিজিট দিতে হবে।
</li>

</ul>

</div>

</form>

<h3 id="result"></h3>

</div>

<!-- LOGIN -->

<div id="loginBox"
style="display:none;">

<h2>Admin Login</h2>

<input type="text"
id="adminUser"
placeholder="Username">

<input type="password"
id="adminPass"
placeholder="Password">

<button onclick="loginAdmin()">

Login

</button>

<button onclick="backToHome()"
style="background:gray;">

Back

</button>

</div>

<!-- ADMIN PANEL -->

<div class="adminPanel"
id="adminPanel">

<h2>Admin Panel</h2>

<select id="openMode">

<option value="always">
Always Open
</option>

<option value="time">
Time Wise Open
</option>

<option value="slot">
Slot Wise Open
</option>

</select>

<!-- TIME BOX -->

<div id="timeBox"
style="display:none;">

<label style="margin-top:10px; display:block;">
Start Time
</label>

<div style="display:flex; gap:5px;">

<input type="time"
id="startTime"
value="10:00">

<select id="startAmPm"
style="width:100px;">

<option value="AM">
AM
</option>

<option value="PM">
PM
</option>

</select>

</div>

<label style="margin-top:10px; display:block;">
End Time
</label>

<div style="display:flex; gap:5px;">

<input type="time"
id="endTime"
value="05:00">

<select id="endAmPm"
style="width:100px;">

<option value="AM">
AM
</option>

<option value="PM">
PM
</option>

</select>

</div>

<input type="number"
id="timeSlotLimit"
placeholder="Time Wise Slot Limit"
value="">

</div>

<!-- SLOT BOX -->

<div id="slotBox"
style="display:none;">

<input type="number"
id="slotLimit"
placeholder="Enter Slot Limit"
value="">

</div>

<button onclick="saveSettings()">

Save Settings

</button>

<hr style="margin:20px 0;">

<h3>Sub Admin</h3>

<input type="text"
id="subUser"
placeholder="Sub Admin Username">

<input type="password"
id="subPass"
placeholder="Sub Admin Password">

<button onclick="addSubAdmin()">

Add Sub Admin

</button>

<select id="subAdminList">
</select>

<button class="deleteBtn"
onclick="deleteSubAdmin()">

Delete Sub Admin

</button>

<hr style="margin:20px 0;">

<div id="activitySection">

<h3>Activity Log</h3>

<div class="activityBox"
id="activityBox">

No Activity

</div>

</div>

<hr style="margin:20px 0;">

<h3>Change Password</h3>

<input type="password"
id="oldPass"
placeholder="Old Password">

<input type="password"
id="newPass"
placeholder="New Password">

<button onclick="changePassword()">

Change Password

</button>

<button class="logoutBtn"
onclick="logoutAdmin()">

Logout

</button>

<div class="clock"
id="liveClock">
</div>

</div>

</div>

<script>

/* GOOGLE SCRIPT */

const scriptURL =
"https://script.google.com/macros/s/AKfycbylnNv2X50FcXkf95NBXNah_HHRHgHh5nY9dnptaNbhoChpfZao1fChnnprMkAVVOIp/exec";

/* TOKEN */

let tokenCount = 0;

/* SETTINGS */

let openMode = "always";

let startTime = "10:00";
let endTime = "05:00";

let startAmPm = "AM";
let endAmPm = "PM";

let slotLimit = 0;
let timeSlotLimit = 0;
let settingsLoaded = false;

async function loadSettings(){
    try{
        const response = await fetch(scriptURL + "?action=getSettings&ts=" + Date.now(), {
            method:"GET", cache:"no-store"
        });
        const data = await response.json();
        if(data.status !== "success" || !data.settings) return;

        const s = data.settings;
        openMode = s.openMode || "always";
        startTime = s.startTime || "10:00";
        endTime = s.endTime || "05:00";
        startAmPm = s.startAmPm || "AM";
        endAmPm = s.endAmPm || "AM";
        slotLimit = s.slotLimit === "" || s.slotLimit == null ? 0 : Number(s.slotLimit);
        timeSlotLimit = s.timeSlotLimit === "" || s.timeSlotLimit == null ? 0 : Number(s.timeSlotLimit);

        document.getElementById("openMode").value = openMode;
        document.getElementById("startTime").value = startTime;
        document.getElementById("endTime").value = endTime;
        document.getElementById("startAmPm").value = startAmPm;
        document.getElementById("endAmPm").value = endAmPm;
        document.getElementById("slotLimit").value = slotLimit || "";
        document.getElementById("timeSlotLimit").value = timeSlotLimit || "";
        document.getElementById("openMode").dispatchEvent(new Event("change"));

        await loadTokenCount();
        settingsLoaded = true;
        updateClock();
    }catch(error){
        console.error("Settings load error:", error);
    }
}

async function loadTokenCount(){
    try{
        const response = await fetch(scriptURL + "?ts=" + Date.now(), {
            method:"GET", cache:"no-store"
        });
        const data = await response.json();
        if(Array.isArray(data)){
            tokenCount = data.length;
            updateClock();
        }
    }catch(error){
        console.error("Token count load error:", error);
    }
}

async function refreshServerData(){
    await loadSettings();
}

/* ADMIN */

let mainAdmin = {

user:"admin",
pass:"8116650096"

};

let currentRole = "";
let currentUser = "";

let subAdmins = [];

let activityLogs = [];

/* VISIT */

document.getElementById("visit")
.addEventListener("change", function(){

if(this.value === "Others"){

document.getElementById("otherReason")
.style.display = "block";

}

else{

document.getElementById("otherReason")
.style.display = "none";

}

});

/* LOGIN */

function toggleLogin(){

document.getElementById("userSection")
.style.display = "none";

document.getElementById("loginBox")
.style.display = "block";

}

function backToHome(){

document.getElementById("userSection")
.style.display = "block";

document.getElementById("loginBox")
.style.display = "none";

}

function loginAdmin(){

let user =
document.getElementById("adminUser").value;

let pass =
document.getElementById("adminPass").value;

if(user === mainAdmin.user &&
pass === mainAdmin.pass){

currentRole = "main";

currentUser = user;

openAdminPanel();

addLog("Main Admin Login");

return;

}

let found = false;

subAdmins.forEach(admin=>{

if(admin.user === user &&
admin.pass === pass){

found = true;

currentRole = "sub";

currentUser = user;

}

});

if(found){

openAdminPanel();

addLog("Sub Admin Login");

}

else{

alert("Wrong Login");

}

}

function openAdminPanel(){

document.getElementById("loginBox")
.style.display = "none";

document.getElementById("adminPanel")
.style.display = "block";

if(currentRole === "main"){

document.getElementById("activitySection")
.style.display = "block";

}

else{

document.getElementById("activitySection")
.style.display = "none";

}

}

function logoutAdmin(){

document.getElementById("adminPanel")
.style.display = "none";

document.getElementById("userSection")
.style.display = "block";

}

/* MODE */

document.getElementById("openMode")
.addEventListener("change", function(){

let mode = this.value;

document.getElementById("timeBox")
.style.display = "none";

document.getElementById("slotBox")
.style.display = "none";

if(mode === "time"){

document.getElementById("timeBox")
.style.display = "block";

}

else if(mode === "slot"){

document.getElementById("slotBox")
.style.display = "block";

}

});

/* SAVE SETTINGS */

async function saveSettings(){
    openMode = document.getElementById("openMode").value;
    startTime = document.getElementById("startTime").value;
    endTime = document.getElementById("endTime").value;
    startAmPm = document.getElementById("startAmPm").value;
    endAmPm = document.getElementById("endAmPm").value;

    const slotValue = document.getElementById("slotLimit").value.trim();
    const timeSlotValue = document.getElementById("timeSlotLimit").value.trim();

    slotLimit = slotValue === "" ? "" : Number(slotValue);
    timeSlotLimit = timeSlotValue === "" ? "" : Number(timeSlotValue);

    try{
        const response = await fetch(scriptURL, {
            method:"POST",
            body:JSON.stringify({
                action:"saveSettings",
                settings:{openMode,startTime,endTime,startAmPm,endAmPm,slotLimit,timeSlotLimit}
            })
        });
        const result = await response.json();

        if(result.status === "success"){
            alert("Settings Saved Successfully");
            await loadSettings();
        }else{
            alert("Settings Save Failed: " + (result.message || "Unknown error"));
        }
    }catch(error){
        console.error(error);
        alert("Server connection failed. Please check Apps Script deployment.");
    }
}

/* FIXED TIME CONVERT */

function convertTo24(time,ampm){

let parts = time.split(":");

let hour = parseInt(parts[0]);

let minute = parts[1];

if(ampm === "PM" && hour < 12){

hour += 12;

}

if(ampm === "AM" && hour === 12){

hour = 0;

}

return hour.toString().padStart(2,'0')
+ ":" + minute;

}

/* CLOCK */

function updateClock(){

let now = new Date();

let currentHour =
now.getHours().toString().padStart(2,'0');

let currentMinute =
now.getMinutes().toString().padStart(2,'0');

let currentTime =
currentHour + ":" + currentMinute;

document.getElementById("liveClock")
.innerHTML =
"Time : " + currentTime;

let text = "";

let start24 =
convertTo24(startTime,startAmPm);

let end24 =
convertTo24(endTime,endAmPm);

/* ALWAYS */

if(openMode === "always"){

text =
"Service : Always Open";

}

/* TIME */

else if(openMode === "time"){

if(currentTime >= start24 &&
currentTime <= end24){

text =
"Open : " +

startTime + " " +
startAmPm +

" To " +

endTime + " " +
endAmPm +

" | Slot Left : " +

(timeSlotLimit - tokenCount);

}

else{

text =
"Service Closed";

}

}

/* SLOT */

else if(openMode === "slot"){

let remaining =
slotLimit - tokenCount;

if(remaining <= 0){

text =
"All Slots Full";

}

else{

text =
"Slot Remaining : " +
remaining;

}

}

document.getElementById("publicStatus")
.innerHTML = text;

}

loadSettings();
setInterval(updateClock,1000);
setInterval(refreshServerData,5000);
updateClock();

/* TOKEN */

document.getElementById("tokenForm")
.addEventListener("submit",
async function(e){

e.preventDefault();

if(!settingsLoaded){
    alert("Please wait while service settings are loading.");
    return;
}

let now = new Date();

let currentTime =
now.getHours().toString().padStart(2,'0')
+ ":" +
now.getMinutes().toString().padStart(2,'0');

let start24 =
convertTo24(startTime,startAmPm);

let end24 =
convertTo24(endTime,endAmPm);

if(openMode === "time"){

if(currentTime < start24 ||
currentTime > end24){

alert("Token Service Closed");

return;

}

if(tokenCount >= timeSlotLimit){

alert("Time Wise Slots Full");

return;

}

}

if(openMode === "slot"){

if(tokenCount >= slotLimit){

alert("All Slots Full");

return;

}

}

const data = {

name:
document.getElementById("name").value,

phone:
"+91" +
document.getElementById("phone").value,

address:
document.getElementById("address").value,

visit:

(
document.getElementById("visit").value
=== "Others"
)

?

document.getElementById("otherReason").value

:

document.getElementById("visit").value,

aadhaar:
document.getElementById("aadhaar").value

};

const response = await fetch(scriptURL,{

method:"POST",

body:JSON.stringify(data)

});

const result =
await response.json();

if(result.status ===
"duplicate_phone"){

document.getElementById("result")
.innerHTML =
"Phone Number Already Exists";

}

else if(result.status ===
"duplicate_aadhaar"){

document.getElementById("result")
.innerHTML =
"Aadhaar Already Exists";

}

else{

tokenCount++;
    await loadTokenCount();
    updateClock();

let tokenText =

"Token Number : " +
result.token +

"\n\nName : " +
data.name +

"\nPhone : " +
data.phone +

"\nVisit : " +
data.visit +

"\nAadhaar Last 4 : " +
data.aadhaar;

document.getElementById("result")
.innerHTML =

"Your Token Number : " +
result.token;

downloadToken(tokenText,result.token);

}

});

/* DOWNLOAD TOKEN */

function downloadToken(text,tokenNo){

let blob = new Blob(
[text],
{type:"text/plain"}
);

let link =
document.createElement("a");

link.href =
URL.createObjectURL(blob);

link.download =
"Token-" + tokenNo + ".txt";

link.click();

}

/* SUB ADMIN */

function addSubAdmin(){

let user =
document.getElementById("subUser").value;

let pass =
document.getElementById("subPass").value;

if(user && pass){

subAdmins.push({

user:user,
pass:pass

});

updateSubAdminList();

alert("Sub Admin Added");

}

}

function updateSubAdminList(){

let list =
document.getElementById("subAdminList");

list.innerHTML = "";

subAdmins.forEach((admin,index)=>{

let option =
document.createElement("option");

option.value = index;

option.text = admin.user;

list.appendChild(option);

});

}

function deleteSubAdmin(){

let index =
document.getElementById("subAdminList").value;

subAdmins.splice(index,1);

updateSubAdminList();

alert("Deleted");

}

/* PASSWORD */

function changePassword(){

let oldPass =
document.getElementById("oldPass").value;

let newPass =
document.getElementById("newPass").value;

if(oldPass === mainAdmin.pass){

mainAdmin.pass = newPass;

alert("Password Changed");

}

else{

alert("Wrong Old Password");

}

}

/* LOG */

function addLog(text){

let now = new Date();

let time =
now.toLocaleTimeString();

activityLogs.unshift(

currentUser +
" : " +
text +
" (" +
time +
")"

);

updateLogs();

}

function updateLogs(){

let box =
document.getElementById("activityBox");

box.innerHTML = "";

activityLogs.forEach(log=>{

box.innerHTML +=

"<div style='margin-bottom:8px;'>"

+ log +

"</div>";

});

}

</script>

</body>

</html>
